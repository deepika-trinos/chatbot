<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens instead of showing a tiny desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    /* The whole chat window, centered and never wider than 500px */
    .chat-container {
      max-width: 500px;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: white;
    }

    h1 {
      margin: 0;
      padding: 15px;
      font-size: 20px;
      text-align: center;
      color: white;
      background: #4a6cf7;
    }

    /* The area where messages appear; scrolls when it gets full */
    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 15px;
    }

    /* Bot messages on the left in grey */
    .bot {
      align-self: flex-start;
      background: #e5e5ea;
    }

    /* Your messages on the right in blue */
    .user {
      align-self: flex-end;
      color: white;
      background: #4a6cf7;
    }

    #chat-form {
      display: flex;
      gap: 10px;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    #user-input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 20px;
    }

    #chat-form button {
      padding: 10px 18px;
      font-size: 16px;
      color: white;
      background: #4a6cf7;
      border: none;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <h1>My Chatbot</h1>

    <div id="chat-box">
      <!-- Sample messages so we can see the design. Module 2 will add real ones. -->
      <div class="message bot">Hello! Type a message to start chatting.</div>
      <div class="message user">Hi</div>
    </div>

    <form id="chat-form">
      <input id="user-input" type="text" placeholder="Type a message..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>
</body>
</html>
