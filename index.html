<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens instead of showing a tiny desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <button id="menu-btn" class="icon-btn" type="button" aria-label="Open chat history">&#9776;</button>
      <h1>My Chatbot</h1>
      <button id="new-chat-btn" class="header-btn" type="button">New chat</button>
    </header>

    <!-- Messages appear here; this area scrolls when it gets full -->
    <main id="chat-box">
      <div class="message bot">Hello! Type a message to start chatting.</div>
    </main>

    <form id="chat-form">
      <input id="user-input" type="text" placeholder="Type a message..." autocomplete="off">
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <!-- Dark layer behind the history drawer; clicking it will close the drawer.
       To show both, add the class "open" to #backdrop and #history-drawer. -->
  <div id="backdrop"></div>

  <aside id="history-drawer" aria-label="Chat history">
    <div class="drawer-header">
      <h2>History</h2>
      <button id="close-drawer-btn" class="icon-btn" type="button" aria-label="Close chat history">&times;</button>
    </div>

    <ul id="history-list">
      <li class="history-empty">No chats yet</li>
    </ul>

    <div class="drawer-footer">
      <button id="clear-all-btn" type="button">Clear all</button>
    </div>
  </aside>

  <!-- Loaded last and in this order: app.js uses the other three -->
  <script src="js/storage.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
